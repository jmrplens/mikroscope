# Release pipeline for mikroscope: a tag in, a GitHub release and a
# multi-platform agent image out. .github/RELEASING.md is the checklist around
# it.

name: Release

on:
  push:
    tags:
      # Three parts, so a tag that is not a release number does not start one.
      # In jmrplens/ghchronicle a bare `v*` started this workflow on every move
      # of the major tag `v1`, whose first job compares the tag against the
      # VERSION file: `1` is not `1.0.0`, so every move left a failed release
      # run behind it.
      - "v*.*.*"

# Everything this workflow is trusted with, and nothing else. id-token is what
# makes the cosign signatures keyless: the identity is this workflow, recorded
# in a public transparency log, so there is no private key to keep anywhere.
# Jobs that need less say so below.
permissions:
  contents: write # create the GitHub release and upload its assets
  packages: write # push the agent image to ghcr.io with the automatic token
  id-token: write # keyless signing

# Two tags pushed close together would race on the same release and on the
# `latest` tag of the image. cancel-in-progress stays false: a release killed
# between the image push and the GitHub release leaves an image published that
# nothing announces.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Pinned exactly rather than by range. goreleaser-action downloads GoReleaser,
  # and the step below downloads syft, into the job that holds the signing
  # identity, so pinning the action and letting the tool float leaves the code
  # that actually runs unpinned. The Makefile's GORELEASER_VERSION is the same
  # number, for `make release-check`.
  GORELEASER_VERSION: "v2.18.1"
  SYFT_VERSION: "v1.51.1"

jobs:
  # The one check that runs before a runner is spent on anything else. Three
  # things read a release number and only two of them read the same one: the
  # binaries, the image tags and the agent image tars come from the git tag,
  # while any unstamped build (`go build`, `go run`, `go install`) reports the
  # VERSION file the root package embeds. If the two disagree the release ships
  # a binary that lies about itself, so fail here instead.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Hold the tag and the VERSION file to each other
        id: version
        run: |
          set -euo pipefail
          FILE_V="$(tr -d '[:space:]' < VERSION)"
          TAG_V="${GITHUB_REF_NAME#v}"
          if [ "${FILE_V}" != "${TAG_V}" ]; then
            echo "::error::VERSION says ${FILE_V} but the tag is v${TAG_V}: the release binaries would report ${TAG_V} while a build from this tree reports ${FILE_V}. Update VERSION, or tag v${FILE_V}."
            exit 1
          fi
          echo "version=${TAG_V}" >> "$GITHUB_OUTPUT"
          echo "releasing ${TAG_V}, VERSION and tag agree"

  # The same workflow ci.yml calls and a maintainer runs by hand, called rather
  # than copied, so there is one harness and a fix to it cannot land in one
  # copy and not the other. Both of its jobs gate: the suite against fakes, and
  # the same suite with no network at all.
  e2e:
    name: E2E gate
    needs: [preflight]
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  # Beside the E2E gate rather than behind it: neither consumes anything the
  # other produces, so running them in series would add the longer one's whole
  # runtime to every release. It gates because a data race is exactly the
  # defect that reaches a tag otherwise: nothing in ci.yml runs the detector,
  # so a release is the one moment the question is guaranteed to be asked.
  race:
    name: Race gate
    needs: [preflight]
    uses: ./.github/workflows/race.yml
    permissions:
      contents: read

  # Both gates sit in front of this job because it is the first one that
  # publishes anything, and what it publishes cannot be taken back once
  # somebody has pulled it.
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [preflight, e2e, race]
    env:
      # Lifted out of `secrets` so a step can ask whether it is set: a fork
      # releasing from its own tag has no Docker Hub credentials and pushes to
      # GHCR alone rather than failing.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # GoReleaser reads the tag history, which a shallow clone does not
          # contain.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # setup-go caches ~/go/pkg/mod and the build cache by default, and a
          # tag run restores what a run on main wrote. This job signs what it
          # compiles, so its inputs must all be fixed by the repository: the
          # modules are downloaded fresh and checked against go.sum instead of
          # coming from an Actions cache no signature covers.
          cache: false

      # GoReleaser shells out to both of these by name, so they have to be on
      # PATH before it runs: syft writes the SBOM for every archive, cosign
      # signs the checksum file (which also lists the agent image tars) and the
      # SBOMs. Cosign comes first because the syft install below uses it to
      # verify what it downloaded.
      #
      # cosign-release is pinned because the cosign major decides how a
      # signature is written and therefore who can verify it afterwards, and
      # letting the installer's default float would let a release change that
      # without a commit here.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Fetched by hand rather than through anchore/sbom-action/download-syft.
      # That action is SHA-pinned, but on Linux it downloads
      # raw.githubusercontent.com/anchore/syft/main/install.sh and runs it with
      # sh, so the code executing in this job came from a branch head. This job
      # holds the identity the keyless signatures are minted for, which is
      # exactly where nothing may be resolved at run time. The bytes are pinned
      # by SHA256 here; cosign additionally proves they came from anchore's
      # release workflow. Its certificate identity ends in refs/heads/main
      # because syft releases from main rather than from the tag, and the
      # certificate asset is base64-wrapped.
      - name: Install Syft
        env:
          SYFT_SHA256: "8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3"
        run: |
          set -euo pipefail
          TARBALL="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          BASE="https://github.com/anchore/syft/releases/download/${SYFT_VERSION}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o "${TARBALL}" "${BASE}/${TARBALL}"
          echo "${SYFT_SHA256}  ${TARBALL}" | sha256sum -c -
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o checksums.txt "${BASE}/syft_${SYFT_VERSION#v}_checksums.txt"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o checksums.pem "${BASE}/syft_${SYFT_VERSION#v}_checksums.txt.pem"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o checksums.sig "${BASE}/syft_${SYFT_VERSION#v}_checksums.txt.sig"
          base64 -d checksums.pem > checksums.decoded.pem
          cosign verify-blob \
            --certificate checksums.decoded.pem \
            --signature checksums.sig \
            --certificate-identity "https://github.com/anchore/syft/.github/workflows/release.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            checksums.txt
          grep " ${TARBALL}\$" checksums.txt | sha256sum -c -
          tar xzf "${TARBALL}" syft
          install -m 0755 syft /usr/local/bin/syft
          rm -f "${TARBALL}" checksums.txt checksums.pem checksums.decoded.pem checksums.sig syft
          syft --version

      # Buildx replaces the default docker driver with a container one: only
      # that driver builds a multi-platform image in a single push, and only a
      # single push accepts the index annotations that give the GHCR package
      # page its description. QEMU is kept beside it as ghchronicle has it.
      # Dockerfile.agent is FROM scratch with one COPY and runs nothing during
      # the build, so whether the emulators are needed for this image has not
      # been established; a local snapshot build of all three platforms
      # (2026-09-15) ran on a machine that has them registered.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub as well as GHCR: a RouterOS device's `/container/config
      # registry-url` ships pointing at registry-1.docker.io, and that setting
      # is global to the device, so `install --remote-image` works there
      # without repointing someone's router. Skipped when the secrets are
      # absent — a fork releasing from its own tag pushes to GHCR alone
      # instead of failing.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The agent image tars are built inside this step, by the before hook in
      # .goreleaser.yaml, with the same stamps as the binaries: not in a step
      # ahead of it, because `release --clean` empties dist/ first and the
      # version, commit and date are GoReleaser's to decide.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Pull what was just published and start it, once per architecture, in a
  # job of its own that holds no write permission. A multi-platform image is
  # assembled from cross-compiled binaries that nothing has ever executed:
  # gitlab-mcp-server published an arm64 image that could not exec at all, and
  # the pipeline had no way to notice because no variant was ever run. arm/v7
  # is the hEX S (2025), a 32-bit userland, and the likeliest to be wrong. This
  # also proves the tag, the manifest and the stamped version agree, which is
  # the whole point of the preflight above. A failure here does not unpublish
  # anything; it says, before anyone installs it, that the release is broken.
  published_image:
    name: Run the published image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, goreleaser]
    permissions:
      contents: read
      # A package ghcr.io creates on its first push is private until someone
      # makes it public, so pulling it needs a login even here.
      packages: read
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the published image on every architecture
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64 linux/arm/v7; do
            out="$(docker run --rm --pull=always --platform "${platform}" \
              "ghcr.io/jmrplens/mikroscope-agent:${VERSION}" -version)"
            echo "${platform}: ${out}"
            case "${out}" in
              "mikroscope-agent ${VERSION} "*) ;;
              *)
                echo "::error::the ${platform} image reports '${out}', expected version ${VERSION}"
                exit 1
                ;;
            esac
          done
