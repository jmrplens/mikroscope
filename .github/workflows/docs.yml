name: Deploy documentation

# The site is built from `site/` and served from GitHub Pages. Nothing else in
# this repository triggers it: a Go change cannot break the docs build, and a
# docs change should not spend a Go CI run.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "site/**"
      # docs/ is generated from site/, so a hand edit to it is exactly what
      # `pnpm run docs:check` below exists to catch.
      - "docs/**"
  workflow_dispatch:

# One deployment at a time, and never cancel one in flight: a half-deployed
# Pages site is a broken Pages site.
concurrency:
  group: pages
  cancel-in-progress: false

# Read-only at the workflow level. The Pages credential and the OIDC identity
# live on the deploy job below, which runs one pinned action and no code of its
# own.
permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    # The build, the gates that read it and pa11y's browser run are minutes
    # between them. A hung browser must not hold a runner for the six-hour
    # default.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Starlight's `lastUpdated` and the sitemap's per-page `<lastmod>`
          # both read per-file git history, which a shallow clone does not have.
          fetch-depth: 0

      # The pinned spec, read from the file that pins it. It was read from a
      # package.json at the repository root, which does not exist — jq wrote
      # nothing, and nothing used the output either. It is the cache key below
      # now, so a wrong read is a cache miss rather than silence.
      - name: Read the pinned pnpm version
        id: pnpm
        run: echo "spec=$(jq -r .packageManager site/package.json)" >> "$GITHUB_OUTPUT"

      # pnpm itself, cached: action-setup downloads it on every run otherwise,
      # and the version is pinned by the spec above, so the key cannot go
      # stale. Same arrangement as ci.yml's two site jobs.
      - name: Cache pnpm
        id: pnpm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/setup-pnpm
          key: pnpm-${{ runner.os }}-${{ steps.pnpm.outputs.spec }}

      - name: Set up pnpm
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json

      - name: Put the cached pnpm on PATH
        if: steps.pnpm-cache.outputs.cache-hit == 'true'
        run: echo "$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Source-level gates, before the build: a palette that fails WCAG or a
      # Spanish page that has drifted from its English source should stop the
      # run without spending a build on it.
      - name: Check
        run: |
          pnpm run contrast:check
          pnpm run i18n:check
          pnpm run check
          pnpm run eslint
          pnpm run docs:check
          pnpm run format:check

      - name: Build
        run: pnpm build

      - name: Validate the built HTML
        run: |
          pnpm run html-validate
          pnpm run htmlhint

      # directives:check is here because an Astro directive that leaks into the
      # output as a literal attribute passes every HTML validator above: it is
      # well-formed HTML that renders wrong.
      - name: Check what the build says to machines
        run: |
          pnpm run a11y:check
          pnpm run schema:check
          pnpm run directives:check
          pnpm run twins:check
          pnpm run llms:check

      # pa11y drives a real browser, and the `pa11y` script points it at
      # Playwright's Chromium. That is a download outside any lockfile, so it is
      # cached keyed on the lockfile: the Playwright version the lockfile pins is
      # what decides which browser build is fetched. `--with-deps` installs
      # system libraries with apt on every run regardless, which is cheap and not
      # cacheable.
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}

      - name: Install the browser pa11y audits with
        run: ./node_modules/.bin/playwright install --with-deps chromium

      # What the pages do in a browser at a real width: nothing scrolling
      # sideways, every table inside its own box, and the copy button visible
      # and clear of the code. It starts a preview of its own on a free port,
      # the same way the pa11y step below does, and it is here rather than in
      # `pnpm run lint` because it drives a browser over every built page at
      # two widths.
      - name: Check the built layout in a browser
        run: pnpm run layout:check

      # puppeteer's install script still downloads a Chrome of its own, which
      # nothing here launches. The script starts the preview on a free port and
      # audits the URL the preview announces, so a server already holding 4321
      # cannot be audited by mistake (scripts/run-pa11y.mjs says how that
      # happened).
      - name: Accessibility (pa11y)
        run: pnpm run pa11y

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
