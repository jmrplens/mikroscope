# Applies the area labels an issue form's "Which part" answer names.
#
# The bug report and the feature request carry a "Which part" dropdown whose
# options name the same areas .github/labeler.yml puts on pull requests, so an
# issue and the pull request that closes it carry the same word. A form can
# only apply the fixed labels in its front matter; GitHub cannot map a
# dropdown answer to a label by itself, so this reads the rendered answer out
# of the body.
#
# The dropdown is multiple-choice, because a fault can span the collector and
# a sink. GitHub renders a multiple answer as one line joined by ", " (seen on
# davisking/dlib#3038: "Linux (x86-64), macOS (Apple Silicon)"), and that is
# ambiguous for an option that itself holds a comma. So no option has one, the
# forms say so next to the options, and splitting on ", " gives the answers
# back exactly.
#
# Only ever adds, like the labeler: a label placed by hand survives an edit,
# and an answer changed to "Not sure" removes nothing. An edit adds only the
# areas it newly names, read against the body as it was before that edit, so
# an area label the maintainer removed stays removed through a title fix or a
# reworded paragraph, and comes back only if the answer is changed to name it
# again. An edit that leaves the body alone does not run at all. An answer
# this file does not know fails the run after the known ones are applied, so
# a form and this map cannot drift apart unnoticed.
#
# No concurrency group: each run reads its own "before" from its own event,
# so runs are independent, and one cancelled by the next would lose the areas
# only it had seen.
#
# The body, before an edit and after it, is text anyone can write. It reaches
# the script as environment variables and is only matched against fixed
# strings; every label added comes from the map below, never from the body.
# Nothing is checked out.

name: Issue area

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  area:
    name: Area from the form
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A pull request has no form. gitlab-mcp-server saw the issues event carry
    # pull requests on milestoned; opened and edited are not known to, and the
    # guard costs nothing. An edit runs only when it changed the body: a title
    # edit carries no changes.body.
    if: >-
      ${{ !github.event.issue.pull_request &&
      (github.event.action == 'opened' || github.event.changes.body) }}
    permissions:
      issues: write
    steps:
      - name: Apply the areas the form named
        env:
          GH_TOKEN: ${{ github.token }}
          # GH_REPO rather than --repo: nothing is checked out, so gh has no
          # repository to infer from the working directory.
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          BODY: ${{ github.event.issue.body }}
          # The body before this edit; empty when the issue was just opened.
          BEFORE: ${{ github.event.changes.body.from }}
        run: |
          set -euo pipefail
          # A form renders each field as a level-3 heading, a blank line and
          # the answer. Take the first non-empty line after "Which part". A
          # body written by hand has no such heading and yields nothing, which
          # is the right answer for it. Carriage returns go first: a body sent
          # from Windows ends its lines with them, and awk does not count one
          # as whitespace, so the heading would never match.
          answer_of() {
            printf '%s\n' "$1" | tr -d '\r' | awk '
              /^### Which part[[:space:]]*$/ { seen = 1; next }
              seen && NF { print; exit }
            '
          }
          area_of() {
            case "$1" in
              "On the router: doctor / plan / install / status / upgrade / uninstall") echo router ;;
              "The agent: sampling / captures / its HTTP endpoints")                    echo agent ;;
              "Recording: record / mark / plot")                                         echo collector ;;
              "The collector: forward / derive / the RouterOS API tier")                 echo collector ;;
              "A sink or the store behind it")                                           echo sinks ;;
              "The Grafana dashboards or alert rules")                                   echo dashboards ;;
              "Getting it: install.sh / install.ps1 / a release archive / an image")    echo distribution ;;
              "The documentation site: a page that breaks / search / layout")            echo site ;;
              "Not sure")                                                                echo none ;;
              *)                                                                         echo unknown ;;
            esac
          }

          answer=$(answer_of "$BODY")
          case "$answer" in
            ""|"_No response_")
              echo "no part named, nothing to add"; exit 0 ;;
          esac

          # The areas the body named before this edit. Keyed by label, never
          # by the text: the old body is as untrusted as the new one.
          declare -A before=()
          old=$(answer_of "${BEFORE:-}")
          while IFS= read -r part; do
            area=$(area_of "$part")
            case "$area" in none|unknown) ;; *) before[$area]=1 ;; esac
          done <<< "${old//, /$'\n'}"

          declare -A labels=()
          unknown=0
          while IFS= read -r part; do
            area=$(area_of "$part")
            case "$area" in
              none) ;;
              unknown)
                echo "::error::unknown answer '${part}' under Which part; the forms and this workflow disagree"
                unknown=1 ;;
              *)
                if [ -n "${before[$area]:-}" ]; then
                  echo "${area} was named before this edit too, so it is left as it is"
                else
                  labels[$area]=1
                fi ;;
            esac
          done <<< "${answer//, /$'\n'}"

          if [ "${#labels[@]}" -gt 0 ]; then
            list=$(IFS=,; echo "${!labels[*]}")
            echo "the form names: ${list}"
            gh issue edit "$ISSUE" --add-label "$list"
          fi
          exit "$unknown"
