# The end-to-end suite: the two built binaries driven against fakes.
#
# What it is. test/e2e builds cmd/mikroscope and cmd/mikroscope-agent, points
# the agent at testdata/proc/rb5009 (the reference device's captured /proc and
# /sys, reachable because internal/agent reads PROC_ROOT and SYS_ROOT from the
# container envlist), and points the collector at either that agent or a fake
# one serving canned samples. Every destination is a receiver in the test
# binary: HTTP capture servers for influx, loki, otlp, elasticsearch and
# telegraf, TCP and UDP listeners for graphite and telegraf's socket modes,
# real files for the file and sql sinks, the process's own stdout for the
# stdout sink, and a scrape of the collector's own /metrics for prometheus.
#
# What it needs. No router, no Grafana, no database, no container, and no
# network: every address it binds or dials is on the loopback interface. The
# `offline` job proves that rather than asserting it, by running the whole
# suite inside a network namespace that has nothing but `lo`. That check is the
# reason this file exists as a job of its own: a suite that quietly grew a
# dependency on a public endpoint would still pass on a runner with egress,
# and would fail on the first one without it.
#
# The stores, for real. A capture server accepts anything; a store does not.
# The `stores` job (test/e2e/docker, build tag dockere2e) starts InfluxDB 3,
# PostgreSQL, Elasticsearch, Graphite, Loki, an OpenTelemetry Collector,
# Telegraf, Prometheus and Grafana with docker compose, runs the same collector
# against the same fake agent with every sink pointed at them, and then asks
# each store its own question with its own API. It still needs no router: the
# samples come from the same canned agent, so the run is reproducible on any
# machine with Docker. It IS on the pull-request path since 2026-09-18, and also
# runs weekly, on dispatch, and on the release gate. It was not, on the grounds
# that nine containers are a lot for a pull request, and that is how 1.0.5
# reached main with two tests in this suite still reading an endpoint the
# release had removed: every pull-request check was green and the tag was what
# found it. Having it there costs 2 min 37 s, measured on the release run that
# failed — containers included.
#
# Duration. Measured on the development machine on 2026-09-12: 15 s for
# `go test ./test/e2e/`, 18 s with the race detector, 16 s inside the network
# namespace. The bounds below are far looser than that because the suite
# drives two processes and ten sinks at 10 Hz, and a loaded shared runner is
# slower than a development machine by an amount nobody has measured.
#
# Three ways in. As a reusable workflow: ci.yml calls it after its compile job,
# so a pull request gets exactly one run of it, and release.yml calls it as a
# gate, so a tag is held to the same file rather than to a copy that drifts.
# Manually, from the "Use workflow from" dropdown, optionally with a custom ref
# such as a fork pull request's merge SHA. And once a week on main, because a
# run that only happens when a pull request touches the code says nothing about
# a main that changed under it through a dependency or a runner image: in
# jmrplens/gitlab-mcp-server the first release rehearsal found three tests that
# had been broken on main for weeks, because nothing ran the suite between
# releases. The weekly run is not a required check.

name: E2E

on:
  schedule:
    # Mondays, 04:41 UTC: off the hour, because GitHub delays runs that pile up
    # on round times, and before the week's first pushes. race.yml follows at
    # 06:23.
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check out (branch, tag, or a fork pull request's merge SHA)"
        default: ""
        type: string
      stores:
        description: "Also run the sinks against the real stores in docker compose"
        default: true
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out; empty means the calling workflow's ref"
        default: ""
        type: string
      stores:
        description: "Also run the sinks against the real stores in docker compose"
        default: false
        type: boolean

permissions:
  contents: read

# Per calling workflow and ref. A newer push to the same ref makes the run in
# flight obsolete, and unlike a suite that starts containers there is nothing
# a cancelled run leaves behind: every process it starts is a child of the test
# binary and every file is under a temporary directory of the runner.
concurrency:
  group: e2e-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Binaries against fakes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Tracks the toolchain go.mod declares, so this file cannot drift
          # from the module it builds.
          go-version-file: go.mod
          cache: true

      - run: go mod download

      # One command, the same one a developer runs: the package, the verbosity
      # and the timeout live in the Makefile rather than being restated here.
      - name: Run the end-to-end suite
        run: make test-e2e

  # The same collector, the same sinks, against the stores themselves. Nine
  # containers, so it is not on the pull-request path: ci.yml calls this
  # workflow without `stores`, and it runs on the weekly schedule, on a manual
  # dispatch, and on the release gate. Everything else about it is the same
  # single make target a developer runs.
  stores:
    name: Sinks against real stores
    if: ${{ github.event_name == 'schedule' || inputs.stores }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download

      # Pulled before the suite so that a registry problem is a named step
      # rather than a timeout inside `docker compose up --wait`.
      - name: Pull the store images
        working-directory: test/e2e/docker
        run: docker compose -p mikroscope-e2e pull --quiet

      - name: Run the sinks against the stores
        run: make test-e2e-docker

      # A store that refused a write says why in its own log, and the suite
      # only sees the silence that follows.
      - name: The stores' logs, if it failed
        if: failure()
        working-directory: test/e2e/docker
        run: docker compose -p mikroscope-e2e logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: make e2e-docker-down

  offline:
    name: No network needed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # `unshare --net` gives the process a fresh network namespace: no
      # interfaces at all until `lo` is brought up, no route off the host, no
      # DNS. If any test reaches for something outside, this is where it
      # fails.
      #
      # The runner user cannot create the namespace, so the target runs
      # `unshare` under sudo, and sudo is what this job used to lose its Go
      # caches to: it resets HOME to root's, and the Go inside the namespace
      # looked for root's cold caches with no network to fill them. The target
      # now warms the caches as the runner user, carries GOCACHE, GOMODCACHE,
      # GOPATH, HOME and PATH across sudo explicitly, and drops back to the
      # runner user (setpriv) once `lo` is up, so the suite reads what the
      # warm-up wrote and leaves nothing root-owned in the caches setup-go
      # saves at the end of the job. The Makefile target explains each piece.
      - name: Run the suite with only a loopback interface
        run: make test-e2e-offline
