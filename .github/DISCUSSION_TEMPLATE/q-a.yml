body:
  - type: markdown
    attributes:
      value: |
        Questions about **getting mikroscope to do what you need** belong here:
        installing it on your board, a flag, a sink, a store, a dashboard, a
        recording. English or Spanish, whichever you prefer.

        Three things are handled elsewhere:

        - **A reading you cannot explain**, a panel or a kernel-log record that
          looks wrong, goes to
          [Reading the data](https://github.com/jmrplens/mikroscope/discussions/categories/reading-the-data).
        - **A reproducible failure**, where the tool measured, wrote or
          installed the wrong thing, is a
          [bug report](https://github.com/jmrplens/mikroscope/issues/new?template=1-bug-report.yml).
        - **A board other than the RB5009** that you ran it on is a
          [board report](https://github.com/jmrplens/mikroscope/issues/new?template=2-board-report.yml),
          even when it did not work.

        [When something does not work](https://jmrp.io/docs/mikroscope/reference/troubleshooting/)
        may answer it before you ask. **Never paste a
        credential**, `.env`, or the output of `/container/print detail`,
        `/container/envs/print`, `/export` or `plan --rsc`, and replace the
        router's public address, its DDNS name and any ssh target reachable
        from the internet.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: The question about your router you want answered, not only the command.
      placeholder: |
        I want the kernel tier in Prometheus next to my SNMP data, from a hAP
        whose container package is installed.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you ran, and what it printed
      description: The command with its flags, the router target and any token replaced, and its output.
      render: text
  - type: input
    id: version
    attributes:
      label: mikroscope version
      description: The output of `mikroscope version`, or "not installed yet".
      placeholder: mikroscope 1.3.0 (commit abc1234, built 2026-09-25T10:00:00Z)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Board and RouterOS version
      description: The `device:` line of `mikroscope doctor`, or `board-name` and `version` from `/system/resource/print`.
      placeholder: RB5009UG+S+IN, RouterOS 7.24.4, arm64
