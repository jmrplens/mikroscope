name: Idea
description: Something the kernel exposes that the agent does not read, a sink it does not reach, or a question the data cannot answer.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The two most useful ideas for this project are a kernel interface a
        RouterOS container can read that is not sampled yet, and a question
        about a router that the recorded data cannot answer. Both are welcome.

        Every source on the router costs CPU on a device that is also routing,
        so the cost of reading it is usually what decides.
  - type: textarea
    id: what
    attributes:
      label: What is missing
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: The question it would let you answer
      description: >
        What you would put on a dashboard, or ask of a recording, that you
        cannot today.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: The source or the store
      description: >
        For a new measurement, the file under /proc or /sys, or the RouterOS
        API path, it would come from. For a new sink, the store and its write
        API.
  - type: textarea
    id: evidence
    attributes:
      label: What you have seen of it on a device
      description: >
        Optional, and the thing that usually decides. The RouterOS version and
        board you read it on, whether it is readable from an unprivileged
        container, how often it changes, and what one read costs.
