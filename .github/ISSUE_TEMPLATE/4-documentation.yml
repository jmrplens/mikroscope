name: Documentation
description: A page on the documentation site is wrong, out of date or broken, or its English and Spanish versions disagree.
labels: [documentation]
assignees: [jmrplens]
body:
  - type: markdown
    attributes:
      value: |
        For a concrete defect: a claim the code or a measurement no longer
        supports, a flag or an output the tool does not have, a number with no
        device, version or date, a broken link or capture, or an English page
        and its Spanish twin that say different things.

        Two things go elsewhere. When the code and the page disagree and you
        cannot tell which is wrong, that is a
        [bug report](https://github.com/jmrplens/mikroscope/issues/new?template=1-bug-report.yml).
        When an explanation simply did not land, ask in
        [Q&A](https://github.com/jmrplens/mikroscope/discussions/categories/q-a):
        the answer usually becomes a better page.

        The pages live under `site/src/content/docs/` and `site/src/content/docs/es/`.
        The Markdown under `docs/` in the repository is generated from the
        English pages, so a fix goes to the page and its twin, never to `docs/`.
  - type: input
    id: page
    attributes:
      label: Page
      description: The address on the documentation site, with the section's anchor if you have it.
      placeholder: https://jmrp.io/docs/mikroscope/install/routes/#a-registry-pull
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Spanish
        - Both
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options:
        - A claim the code or a measurement no longer supports
        - A command or flag or output the tool does not have or print
        - A number without its device or RouterOS version or date
        - The English and Spanish pages say different things
        - A broken link or anchor or image or capture
        - The layout on a phone or a desktop
        - Something else
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: What it says, and what it should say
      description: >
        Quote the passage. If you know the correction, give it with its
        evidence: the code path, the command and its output, or the device,
        RouterOS version and date you measured it on.
    validations:
      required: true
