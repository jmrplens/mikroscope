name: Feature request
description: A change whose source is known — a kernel file, a RouterOS API path, a store's write API, a panel or a flag.
labels: [enhancement]
assignees: [jmrplens]
body:
  - type: markdown
    attributes:
      value: |
        The two most useful requests here are a kernel interface a RouterOS
        container can read that is not sampled yet, and a question about a
        router that the recorded data cannot answer.

        This form is for a change that can be built: you know where the data
        would come from. If what you have is the question and not the source,
        start in
        [Ideas](https://github.com/jmrplens/mikroscope/discussions/categories/ideas),
        where the source and its cost get worked out; it becomes an issue once
        they are.

        Every source on the router costs CPU on a device that is also routing,
        so the cost of one read is usually what decides. "Not measured" is a
        valid answer, and a useful one.
  - type: dropdown
    id: part
    attributes:
      label: Which part
      description: >
        Every part it would change. The answer adds the matching area label,
        the same one the pull request that builds it gets.
      multiple: true
      # These strings are matched exactly by .github/workflows/issue-area.yml,
      # and the same list is in 1-bug-report.yml: change all three together.
      # No option may contain a comma, because GitHub joins a multiple answer
      # with ", ".
      options:
        - "On the router: doctor / plan / install / status / upgrade / uninstall"
        - "The agent: sampling / captures / its HTTP endpoints"
        - "Recording: record / mark / plot"
        - "The collector: forward / derive / the RouterOS API tier"
        - "A sink or the store behind it"
        - "The Grafana dashboards or alert rules"
        - "Getting it: install.sh / install.ps1 / a release archive / an image"
        - "The documentation site: a page that breaks / search / layout"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is missing
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: The question it would let you answer
      description: >
        What you would put on a dashboard, or ask of a recording, that you
        cannot today.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where it comes from
      description: >
        For a new measurement, the file under /proc or /sys, or the RouterOS
        API path. For a new sink, the store and its write API. For a panel or
        a flag, the series or the setting it reads.
      placeholder: "/proc/<file> or /sys/<path>, a RouterOS API path, or a store's write API"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What you have seen of it on a device
      description: >
        The board, the RouterOS version and the date you read it on, whether it
        is readable from an unprivileged container, how often it changes, and
        what one read costs. Say which of these you measured and which you did
        not.
  - type: input
    id: discussion
    attributes:
      label: Discussion where it was worked out
      placeholder: https://github.com/jmrplens/mikroscope/discussions/...
  - type: checkboxes
    id: help
    attributes:
      label: Taking part
      options:
        - label: I can measure it on my board.
          required: false
        - label: I would send the pull request.
          required: false
