# mikroscope alert rules for influxdb — Grafana unified alerting provisioning (apiVersion 1).
# Replace DS_UID_PLACEHOLDER with your datasource UID and drop the file into
# /etc/grafana/provisioning/alerting/. Every threshold is zero, the device's own
# published ceiling, or a multiple of its own trailing rate; nothing here is a
# number compiled in for one router.
apiVersion: 1
groups:
  - orgId: 1
    name: mikroscope
    folder: mikroscope
    interval: 1m
    rules:
      - uid: mikroscope-agent-silent
        title: "mikroscope agent stopped delivering samples"
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
          source: mikroscope
        annotations:
          summary: "No new samples reached the store in the last two minutes: the agent stopped, the collector stopped, or the path between them did. Every other rule is blind while this one fires."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_UID_PLACEHOLDER
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: table
              dataset: iox
              rawSql: "SELECT count(1) AS value FROM mikroscope_cpu WHERE time >= now() - interval '2 minutes'"
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}}]}
      - uid: mikroscope-softnet-drops
        title: "Packets dropped in the kernel receive path"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          source: mikroscope
        annotations:
          summary: "softnet_stat dropped a packet: a per-CPU backlog was full. Unambiguous loss inside the router, invisible to every SNMP and RouterOS counter. Zero is the expected reading."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_UID_PLACEHOLDER
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: table
              dataset: iox
              rawSql: "SELECT coalesce(sum(dropped), 0)::BIGINT AS value FROM mikroscope_softnet WHERE time >= now() - interval '5 minutes'"
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}
      - uid: mikroscope-oom-kill
        title: "The kernel OOM-killed a process"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          source: mikroscope
        annotations:
          summary: "/proc/vmstat oom_kill moved: the kernel killed a process to get memory back. Which process is not knowable from the container (no PID namespace)."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_UID_PLACEHOLDER
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: table
              dataset: iox
              rawSql: "SELECT coalesce(sum(oom_kill), 0)::BIGINT AS value FROM mikroscope_vm WHERE time >= now() - interval '5 minutes'"
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}
      - uid: mikroscope-detections
        title: "The collector's derive stage flagged an event"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          source: mikroscope
        annotations:
          summary: "A detection rule fired (counter-reset, agent-restart, agent-oom, reboot, link-flap, conntrack-cliff, conntrack-high, thermal-high, thermal-rising). The rule, key, value and threshold are in the Detections section and on the dashboard as an annotation. microburst and ipc-collapse are drawn and stored like every detection but do not fire this rule: they describe how a healthy router carries traffic. On the reference RB5009 they were 64 of 71 detections from 2026-09-23 10:30 to 2026-09-24 10:30 UTC, and left in they fired this rule in 43 of 288 five-minute windows; without them it fired in 6."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_UID_PLACEHOLDER
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: table
              dataset: iox
              rawSql: "SELECT count(1) AS value FROM mikroscope_detection WHERE time >= now() - interval '5 minutes' AND rule NOT IN ('microburst', 'ipc-collapse')"
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}
      - uid: mikroscope-thermal-near-critical
        title: "A thermal zone is within 15 % of its own critical trip"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          source: mikroscope
        annotations:
          summary: "The reading is at or above 85 % of the zone's declared critical trip point (105 C on the reference RB5009). The ceiling is the board's own, read from /sys, not a number compiled in."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_UID_PLACEHOLDER
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: table
              dataset: iox
              rawSql: "SELECT count(1) AS value FROM (SELECT zone, max(celsius) AS c, max(critical_celsius) AS crit FROM mikroscope_thermal WHERE time >= now() - interval '2 minutes' AND critical_celsius IS NOT NULL GROUP BY zone) AS zones WHERE c >= 0.85 * crit"
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}
      - uid: mikroscope-conntrack-near-limit
        title: "The connection table is above 80 % of nf_conntrack_max"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          source: mikroscope
        annotations:
          summary: "nf_conntrack active objects over the kernel's own ceiling. Past the ceiling the router drops new connections. The limit is the sysctl the agent read, not a compiled number."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_UID_PLACEHOLDER
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: table
              dataset: iox
              rawSql: "SELECT max(active) * 1.0 / nullif(max(\"limit\"), 0) AS value FROM mikroscope_slab WHERE time >= now() - interval '2 minutes' AND cache = 'nf_conntrack' AND \"limit\" IS NOT NULL"
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0.8]}}]}
      - uid: mikroscope-agent-oom
        title: "mikroscope's own container was OOM-killed"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          source: mikroscope
        annotations:
          summary: "The kernel killed a process inside the agent's cgroup: the capture ring and the captures are gone, and every number in the window is suspect. Raise --memory-max or lower RATE_HZ, BUFFER_S or CAPTURE_MB."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_UID_PLACEHOLDER
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: table
              dataset: iox
              rawSql: "SELECT coalesce(sum(oom_kill), 0)::BIGINT AS value FROM mikroscope_self WHERE time >= now() - interval '5 minutes' AND oom_kill IS NOT NULL"
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}
      - uid: mikroscope-l2-loop
        title: "The bridge received its own address back: a layer-2 loop signature"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          source: mikroscope
        annotations:
          summary: "The kernel log reported `received packet on <port> with own address as source address`: a frame the router sent came back in, which is what a loop through a downstream switch or access point looks like. The port label says which cable. Read from /dev/kmsg by the agent, no API. On the reference RB5009 this ran at 1.49 records/s for hours on 2026-09-12 while every RouterOS counter looked healthy. The InfluxDB form needs a store that has held at least one port record classified by kind."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_UID_PLACEHOLDER
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: table
              dataset: iox
              rawSql: "SELECT coalesce(sum(count), 0)::BIGINT AS value FROM mikroscope_kmsg WHERE time >= now() - interval '5 minutes' AND kind = 'own-address'"
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}
      - uid: mikroscope-port-link-down
        title: "A port's link went down"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          source: mikroscope
        annotations:
          summary: "The kernel log reported a link-down on a port: a cable pulled, a peer rebooted or powered off, a renegotiation. The collector's link-flap detection covers the repeated case; this is the single event. Read from /dev/kmsg by the agent, no API; the port, its comment and its role are on the Kernel log section's port events."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_UID_PLACEHOLDER
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: table
              dataset: iox
              rawSql: "SELECT coalesce(sum(count), 0)::BIGINT AS value FROM mikroscope_kmsg WHERE time >= now() - interval '5 minutes' AND kind = 'link-down'"
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}
      - uid: mikroscope-port-errors
        title: "A port is counting typed MAC errors"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          source: mikroscope
        annotations:
          summary: "A port's MAC is counting typed errors: frames it could not take. The commonest on a switched LAN is rx-overflow, the receive FIFO filling faster than the chip can drain it, and it is a microburst signature rather than a load one — on the reference RB5009 it ran at 0.5 % of the packets the NAS sent while the 2.5 GbE link sat at 0.36 % occupancy, because the sender was emitting TSO super-segments at line rate toward a 1 GbE destination. FCS errors and collisions mean something else: cabling, duplex, a dying port. Which port and which error is one row each in the dashboard's Interface traffic section; the procedure is in the port-errors playbook. Needs the API tier: a MAC counter is not visible from inside the container. It cannot tell a real error from a counter reset, so a router that reboots inside the window fires it once."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_UID_PLACEHOLDER
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: table
              dataset: iox
              rawSql: "SELECT coalesce(sum(v), 0)::BIGINT AS value FROM (SELECT interface, greatest(max(rx_overflow) - min(rx_overflow), 0)::BIGINT + greatest(max(rx_fcs_error) - min(rx_fcs_error), 0)::BIGINT + greatest(max(rx_fragment) - min(rx_fragment), 0)::BIGINT + greatest(max(rx_too_short) - min(rx_too_short), 0)::BIGINT + greatest(max(rx_too_long) - min(rx_too_long), 0)::BIGINT + greatest(max(rx_jabber) - min(rx_jabber), 0)::BIGINT + greatest(max(tx_fcs_error) - min(tx_fcs_error), 0)::BIGINT + greatest(max(tx_late_collision) - min(tx_late_collision), 0)::BIGINT + greatest(max(tx_excessive_collision) - min(tx_excessive_collision), 0)::BIGINT AS v FROM mikroscope_api_ifcounters WHERE time >= now() - interval '5 minutes' GROUP BY interface) AS ports"
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}
      - uid: mikroscope-bridge-port-dark
        title: "A bridge port is receiving but the bridge sends it nothing"
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          source: mikroscope
        annotations:
          summary: "A port that is a member of a bridge has received packets for ten minutes while the bridge delivered it neither a unicast nor a broadcast frame. Whatever is behind it is transmitting and hearing nothing back: STP holds the port discarding, or the bridge learned every host behind it on another path. RouterOS shows the port running and error-free throughout. On the reference RB5009 this was the steady state of a layer-2 loop through a mesh access point: 34 h on sfp-sfpplus1 and then 62 h on ether2 (2026-09-19..23), which carried 12 packets a second in and 1 out until the second path was broken. For most of the first phase the own-address rule had pointed at ether2, the wrong port. EXPECTED TO FIRE on a redundant design: an RSTP alternate port discards on purpose, and so does a port with broadcast-flood=no or horizon set; silence it for that port. Needs the API tier: the port counters are not visible from inside the container."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_UID_PLACEHOLDER
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: table
              dataset: iox
              rawSql: "SELECT count(*)::BIGINT AS value FROM (SELECT interface, max(rx_packet) - min(rx_packet) AS drx, max(tx_unicast) - min(tx_unicast) AS dtu, max(tx_broadcast) - min(tx_broadcast) AS dtb FROM mikroscope_api_ifcounters WHERE time >= now() - interval '10 minutes' AND bridge IS NOT NULL AND bridge <> '' GROUP BY interface) AS ports WHERE drx > 0 AND dtu = 0 AND dtb = 0"
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}
      - uid: mikroscope-wakeup-storm
        title: "The kernel is switching context four times as often as over its last day"
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          source: mikroscope
        annotations:
          summary: "The kernel's context-switch rate over the last ten minutes is more than four times its mean over the 24 hours before. Something started waking up very often: a busy-polling process or driver, a monitoring client, a container in a tight loop. On the reference RB5009 it was a Home Assistant integration polling the router over the API (2026-09-23): timer interrupts went from ~2 500 to ~35 000 a second in bursts of 20–90 s on one core at a time, and RouterOS's own profile barely showed it. Look at what started at the moment the rule fired (/user/active, new containers, a new integration) and at the Interrupts and softirqs section. Fires once per change of regime and clears as the new rate becomes the day's baseline; a deliberate change (a new container, a heavier ruleset) fires it too."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_UID_PLACEHOLDER
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: table
              dataset: iox
              rawSql: "SELECT CASE WHEN base_min >= 720 THEN (now_sum / nullif(now_min * 60.0, 0)) / nullif(base_sum / (base_min * 60.0), 0) ELSE 0.0 END AS value FROM (SELECT sum(CASE WHEN time >= now() - interval '10 minutes' THEN CAST(ctxt AS BIGINT) ELSE 0 END) AS now_sum, count(DISTINCT CASE WHEN time >= now() - interval '10 minutes' THEN date_bin(interval '1 minute', time) END) AS now_min, sum(CASE WHEN time < now() - interval '10 minutes' THEN CAST(ctxt AS BIGINT) ELSE 0 END) AS base_sum, count(DISTINCT CASE WHEN time < now() - interval '10 minutes' THEN date_bin(interval '1 minute', time) END) AS base_min FROM mikroscope_stat WHERE time >= now() - interval '1450 minutes') AS w"
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [4]}}]}
      - uid: mikroscope-egress-queue-drops
        title: "A port's egress queue has been dropping every minute for ten minutes"
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          source: mikroscope
        annotations:
          summary: "A port's own egress queue has dropped packets in every one of the last ten minutes. UNLIKE THE OTHER COUNTER RULES, THIS ONE'S COUNTER IS SUPPOSED TO MOVE: dropping is how a full queue tells a sender to slow down, so a link that is briefly saturated drops a few packets and is working as designed. That is why the threshold stays at zero and the ten-minute pending period carries the judgement — it takes ten consecutive minutes of dropping to fire, and no single burst can do it however large. On the reference RB5009 a 1 GbE port to a server lost 3 337 packets in six one-second bursts over 6.5 h, peaking at 436 packets/s (measured 2026-09-19): real, visible on the egress queue panel, and correctly not an alert. What fires this is a link that is simply too small for what it is being asked to carry, or a shaper set below the traffic. What it cannot tell you is which: queue discipline, buffer exhaustion and a policer all land in this one counter, and the port and the shape of the dropping are in the dashboard's Interface traffic section. This is a different fault from the typed MAC errors of mikroscope-port-errors, which are frames the hardware could not take rather than frames the router chose not to send. Needs the API tier: monitor-traffic is not visible from inside the container."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_UID_PLACEHOLDER
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: table
              dataset: iox
              rawSql: "SELECT coalesce(max(tx_queue_drops), 0)::BIGINT AS value FROM mikroscope_api_iface WHERE time >= now() - interval '1 minute'"
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}
      - uid: mikroscope-ecc-failure
        title: "The NAND reported an uncorrectable ECC failure"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          source: mikroscope
        annotations:
          summary: "ecc_failures rose on an MTD partition: a read the error correction could not fix, i.e. data loss on the flash. Any increment is an incident."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: DS_UID_PLACEHOLDER
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: table
              dataset: iox
              rawSql: "SELECT coalesce(sum(delta), 0)::BIGINT AS value FROM (SELECT max(ecc_failures) - min(ecc_failures) AS delta FROM mikroscope_mtd WHERE time >= now() - interval '1 hour' AND ecc_failures IS NOT NULL GROUP BY \"partition\") AS parts"
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}
