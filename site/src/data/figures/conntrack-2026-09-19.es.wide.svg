<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" role="img" aria-labelledby="conntrack-2026-09-19-es-wide-t conntrack-2026-09-19-es-wide-d">
	<title id="conntrack-2026-09-19-es-wide-t">El recuento del slab frente al de la API, cinco días</title>
	<desc id="conntrack-2026-09-19-es-wide-d">Medias horarias, del 2026-09-19 11:00 al 2026-09-24 11:00 UTC, del almacén InfluxDB de referencia (RB5009UG+S+, RouterOS 7.24.4, Linux 5.6.3): el /ip/firewall/connection/print count-only de la API de RouterOS, una mediana de 338 lecturas por hora, frente a los objetos activos de la caché de slab nf_conntrack que leyó el agente. El recuento de la API fue de 3 444 a 9 761; en todas las horas el del slab fue entre 1,02 y 1,08 veces el de la API, y las dos series horarias correlacionan con r = 0,9995. nf_conntrack_max marcó 966 656 todo el tiempo.</desc>
