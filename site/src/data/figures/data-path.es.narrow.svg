	<rect x="162" y="346" width="132" height="24" rx="6" fill="var(--ms-surface-raised, #ffffff)" stroke="var(--ms-border, #d4dade)"/>
	<text x="228" y="362" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="var(--ms-body, #2d383f)">Prometheus</text>
	<rect x="22" y="376" width="132" height="24" rx="6" fill="var(--ms-surface-raised, #ffffff)" stroke="var(--ms-border, #d4dade)"/>
	<text x="88" y="392" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="var(--ms-body, #2d383f)">fichero · SQL</text>
	<rect x="162" y="376" width="132" height="24" rx="6" fill="var(--ms-surface-raised, #ffffff)" stroke="var(--ms-border, #d4dade)"/>
	<text x="228" y="392" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="var(--ms-body, #2d383f)">Loki · OTLP</text>
	<rect x="22" y="406" width="132" height="24" rx="6" fill="var(--ms-surface-raised, #ffffff)" stroke="var(--ms-border, #d4dade)"/>
	<text x="88" y="422" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="var(--ms-body, #2d383f)">Graphite · Elastic</text>
	<rect x="162" y="406" width="132" height="24" rx="6" fill="var(--ms-surface-raised, #ffffff)" stroke="var(--ms-border, #d4dade)"/>
	<text x="228" y="422" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="var(--ms-body, #2d383f)">Telegraf · stdout</text>
</svg>
