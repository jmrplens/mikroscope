	<title id="port-overflow-2026-09-19-es-narrow-t">El desbordamiento de recepción de ether1, antes y después de pararse</title>
	<desc id="port-overflow-2026-09-19-es-narrow-d">Cada diez minutos, del 2026-09-19 11:10 al 2026-09-20 00:00 UTC, del almacén InfluxDB de referencia (RB5009UG+S+, RouterOS 7.24.4, Linux 5.6.3): los incrementos de los contadores rx-overflow y de paquetes recibidos de ether1, leídos por la capa de la API una mediana de 56 veces cada diez minutos. Todos los tramos de diez minutos desde las 11:10 hasta las 15:30 desbordaron, 24 550 en las 4 h 20 min anteriores a las 15:30; las dos horas siguientes no tuvieron ninguno, y las 8 h 30 min posteriores enteras, 131. El puerto recibió una mediana de 313 paquetes por segundo antes y 286 después.</desc>
