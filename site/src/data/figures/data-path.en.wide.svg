<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 266" width="100%" role="img" aria-labelledby="data-path-en-wide-t data-path-en-wide-d">
	<title id="data-path-en-wide-t">Where the data comes from and where it goes</title>
	<desc id="data-path-en-wide-d">The router runs the agent in a container that reads the shared kernel and serves it over a veth. The collector on your machine pulls that, merges the RouterOS API tier into it, derives, and writes to every sink you named.</desc>
	<defs>
		<marker id="data-path-en-wide-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ms-border-strong, #aab4ba)"/>
		</marker>
	</defs>
	<rect x="8" y="8" width="300" height="250" rx="12" fill="var(--ms-surface, #f5f7f8)" stroke="var(--ms-border, #d4dade)" stroke-dasharray="6 4"/>
	<text x="22" y="28" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="var(--ms-body, #2d383f)" letter-spacing="0.03em">THE ROUTER</text>
	<rect x="28" y="40" width="260" height="56" rx="8" fill="var(--ms-surface-raised, #ffffff)" stroke="var(--ms-border, #d4dade)"/>
	<text x="158" y="64" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="var(--ms-heading, #10171b)">Shared kernel</text>
	<text x="158" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="var(--ms-muted, #5a666d)">/proc · /sys · /dev/kmsg · PMU</text>
	<line x1="158" y1="96" x2="158" y2="124" stroke="var(--ms-border-strong, #aab4ba)" stroke-width="1.5" marker-end="url(#data-path-en-wide-arrow)"/>
	<rect x="28" y="126" width="260" height="56" rx="8" fill="var(--ms-surface-raised, #ffffff)" stroke="var(--ms-border, #d4dade)"/>
	<text x="158" y="150" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="600" fill="var(--ms-heading, #10171b)">mikroscope-agent</text>
	<text x="158" y="169" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="var(--ms-muted, #5a666d)">1–100 Hz · 300 s ring · HTTP</text>
	<rect x="28" y="192" width="260" height="50" rx="8" fill="var(--ms-surface-raised, #ffffff)" stroke="var(--ms-border-strong, #aab4ba)" stroke-dasharray="4 3"/>
	<text x="158" y="213" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="var(--ms-heading, #10171b)">RouterOS API</text>
	<text x="158" y="232" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="var(--ms-muted, #5a666d)">1 Hz, what the kernel cannot see</text>
	<rect x="340" y="8" width="280" height="250" rx="12" fill="var(--ms-surface, #f5f7f8)" stroke="var(--ms-border, #d4dade)" stroke-dasharray="6 4"/>
	<text x="354" y="28" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="var(--ms-body, #2d383f)" letter-spacing="0.03em">YOUR MACHINE</text>
	<rect x="360" y="96" width="240" height="66" rx="8" fill="var(--ms-surface-raised, #ffffff)" stroke="var(--ms-border, #d4dade)"/>
	<text x="480" y="125" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="600" fill="var(--ms-heading, #10171b)">mikroscope forward</text>
	<text x="480" y="144" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="var(--ms-muted, #5a666d)">pull · merge · derive · fan out</text>
	<line x1="288" y1="150" x2="356" y2="124" stroke="var(--ms-border-strong, #aab4ba)" stroke-width="1.5" marker-end="url(#data-path-en-wide-arrow)"/>
	<text x="330" y="137" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="var(--ms-muted, #5a666d)">veth /30</text>
	<line x1="288" y1="217" x2="356" y2="148" stroke="var(--ms-border-strong, #aab4ba)" stroke-width="1.5" marker-end="url(#data-path-en-wide-arrow)"/>
	<rect x="652" y="8" width="230" height="250" rx="12" fill="var(--ms-surface, #f5f7f8)" stroke="var(--ms-border, #d4dade)" stroke-dasharray="6 4"/>
	<text x="666" y="28" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="var(--ms-body, #2d383f)" letter-spacing="0.03em">SINKS</text>
	<rect x="672" y="40" width="190" height="26" rx="6" fill="var(--ms-surface-raised, #ffffff)" stroke="var(--ms-border, #d4dade)"/>
	<text x="767" y="57" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="var(--ms-body, #2d383f)">InfluxDB 3</text>
	<rect x="672" y="74" width="190" height="26" rx="6" fill="var(--ms-surface-raised, #ffffff)" stroke="var(--ms-border, #d4dade)"/>
	<text x="767" y="91" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="var(--ms-body, #2d383f)">Prometheus</text>
	<rect x="672" y="108" width="190" height="26" rx="6" fill="var(--ms-surface-raised, #ffffff)" stroke="var(--ms-border, #d4dade)"/>
	<text x="767" y="125" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="var(--ms-body, #2d383f)">file · SQL</text>
	<rect x="672" y="142" width="190" height="26" rx="6" fill="var(--ms-surface-raised, #ffffff)" stroke="var(--ms-border, #d4dade)"/>
	<text x="767" y="159" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="var(--ms-body, #2d383f)">Loki · OTLP</text>
	<rect x="672" y="176" width="190" height="26" rx="6" fill="var(--ms-surface-raised, #ffffff)" stroke="var(--ms-border, #d4dade)"/>
	<text x="767" y="193" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="var(--ms-body, #2d383f)">Graphite · Elastic</text>
	<rect x="672" y="210" width="190" height="26" rx="6" fill="var(--ms-surface-raised, #ffffff)" stroke="var(--ms-border, #d4dade)"/>
	<text x="767" y="227" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="var(--ms-body, #2d383f)">Telegraf · stdout</text>
	<line x1="600" y1="129" x2="670" y2="129" stroke="var(--ms-border-strong, #aab4ba)" stroke-width="1.5" marker-end="url(#data-path-en-wide-arrow)"/>
	<text x="635" y="122" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="var(--ms-muted, #5a666d)">pull every 500 ms</text>
</svg>
