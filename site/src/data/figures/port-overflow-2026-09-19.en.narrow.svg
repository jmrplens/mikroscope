<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 363" width="100%" role="img" aria-labelledby="port-overflow-2026-09-19-en-narrow-t port-overflow-2026-09-19-en-narrow-d">
	<title id="port-overflow-2026-09-19-en-narrow-t">ether1's receive overflow, before and after it stopped</title>
	<desc id="port-overflow-2026-09-19-en-narrow-d">Per ten minutes, 2026-09-19 11:10 to 2026-09-20 00:00 UTC, from the reference InfluxDB store (RB5009UG+S+, RouterOS 7.24.4, Linux 5.6.3): the increments of ether1's rx-overflow and received-packet counters, read by the API tier a median of 56 times per ten minutes. Every ten minutes from 11:10 to 15:30 overflowed, 24 550 in the 4 h 20 min before 15:30; the two hours after it had none, and the whole 8 h 30 min after it 131. The port received a median of 313 packets a second before and 286 after.</desc>
