<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 382" width="100%" role="img" aria-labelledby="conntrack-2026-09-19-en-narrow-t conntrack-2026-09-19-en-narrow-d">
	<title id="conntrack-2026-09-19-en-narrow-t">The slab count against the API's, five days</title>
	<desc id="conntrack-2026-09-19-en-narrow-d">Hourly means, 2026-09-19 11:00 to 2026-09-24 11:00 UTC, from the reference InfluxDB store (RB5009UG+S+, RouterOS 7.24.4, Linux 5.6.3): the RouterOS API's /ip/firewall/connection/print count-only, a median of 338 readings an hour, against the active objects of the nf_conntrack slab cache the agent read. The API count ran from 3 444 to 9 761; in every hour the slab count was 1.02 to 1.08 times it, and the two hourly series correlate at r = 0.9995. nf_conntrack_max read 966 656 throughout.</desc>
