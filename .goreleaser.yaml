# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
project_name: mikroscope
version: 2

before:
  hooks:
    - go mod download
    # The side-loadable agent image tars, one per architecture, through the
    # same builder `mikroscope install` uses (internal/image). A hook rather
    # than a workflow step for two reasons: `release --clean` empties dist/
    # before anything else runs, which once took tars written there ahead of
    # GoReleaser with it, and only here are the version, commit and date the
    # binaries below are stamped with known. The script writes outside dist/,
    # to build/agent-images/, which release.extra_files and checksum.extra_files
    # then pick up. A global hook is a plain command line, not run by a shell,
    # so the stamps reach the script through env(1).
    - env VERSION={{ .Version }} COMMIT={{ .ShortCommit }} BUILD_DATE={{ .CommitDate }} ./scripts/agent-tars.sh build/agent-images

builds:
  - id: mikroscope
    main: ./cmd/mikroscope/
    binary: mikroscope
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - { goos: windows, goarch: arm }
      - { goos: darwin, goarch: arm }
    # internal/version.Version is what the release number reaches the binary
    # by, and the tag is what names it: the VERSION file is a floor the root
    # package embeds, and the release workflow's preflight holds the two equal
    # before this runs. The date is the commit's, not the build's, so
    # rebuilding the same tag produces the same binary; mod_timestamp does the
    # same for the file's mtime.
    ldflags:
      - -s -w
      - -X github.com/jmrplens/mikroscope/internal/version.Version={{ .Version }}
      - -X github.com/jmrplens/mikroscope/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/jmrplens/mikroscope/internal/version.BuildDate={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The agent, for everything a MikroTik device can be. The container package
  # exists for arm, arm64 and x86 only (MikroTik's container documentation),
  # and 32-bit ARM is two things: the same documentation says "for devices
  # with EN7562CT CPU like the hEX Refresh, only arm32v5 container images are
  # supported", while MikroTik's other 32-bit ARM boards run an ARMv7 userland.
  # An ARMv5 binary runs on both and an ARMv7 one does not run on the first,
  # so both levels are built and published, and the board picks its own.
  - id: mikroscope-agent
    main: ./cmd/mikroscope-agent/
    binary: mikroscope-agent
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux]
    goarch: [amd64, arm64, arm]
    goarm: ["5", "7"]
    # The same three stamps as the CLI, and the same three internal/image
    # writes into the agent of every tar the hook above builds, so the
    # archive, the image and the tar of one release report one identity.
    ldflags:
      - -s -w
      - -X github.com/jmrplens/mikroscope/internal/version.Version={{ .Version }}
      - -X github.com/jmrplens/mikroscope/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/jmrplens/mikroscope/internal/version.BuildDate={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: cli
    ids: [mikroscope]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
  - id: agent
    ids: [mikroscope-agent]
    formats: [tar.gz]
    name_template: "mikroscope-agent_{{ .Version }}_linux_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files: [LICENSE]

# The agent image tars are listed here as well as under release.extra_files:
# an extra file is otherwise uploaded without a line in checksums.txt, and the
# checksum file is the one thing the signature below covers, so a tar outside
# it would be the one asset of the release nothing vouches for.
checksum:
  name_template: "checksums.txt"
  algorithm: sha256
  extra_files:
    - glob: build/agent-images/*.tar

# `archive`, not `binary`: this project ships tar.gz and zip archives, and the
# artifact filter has to name the kind that actually exists or GoReleaser logs
# "no artifacts matching current filters" and ships no SBOM at all.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"

# Keyless signing: the identity is the workflow that ran, recorded in a public
# transparency log, so there is no private key for anyone to lose or leak. The
# checksum file covers every archive and every agent image tar through its
# digest; the SBOMs are signed in their own right because they are consumed
# separately from the archives.
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
  - id: sboms
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: sbom

# CHANGELOG.md is the record of what changed and what it was measured against;
# notes generated from commit subjects would be a second, thinner account.
changelog:
  disable: true

# One multi-platform agent image. GoReleaser assembles the manifest itself, so
# there is no docker_manifests block: on a real release it runs a single
# `buildx build --platform linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v5 --push`, which
# is also why the index annotations below are accepted. A local
# `goreleaser release --snapshot` builds each platform separately with --load
# instead, and buildx refuses index annotations on a single-platform export,
# so a local dry run needs `--skip=docker`.
#
# linux/arm/v5 is the EN7562CT boards (hEX Refresh), linux/arm/v7 MikroTik's
# other 32-bit ARM userland, linux/arm64 the RB5009 class and linux/amd64 x86
# CHR. A multi-platform index is what lets `--remote-image` work on all of them
# without the operator knowing which their board is.
dockers_v2:
  - id: agent
    ids: [mikroscope-agent]
    # Two registries, one build. GHCR is where a GitHub user looks first;
    # Docker Hub is where a --remote-image reference without a registry host
    # goes: mikroscope sends it to the router as registry-1.docker.io/…, and
    # the host inside remote-image= is what RouterOS pulls from, so the
    # device-wide `/container/config registry-url` does not decide the pull.
    # Measured on the reference RB5009, RouterOS 7.24.4, 2026-09-24: the host
    # overrode registry-url, and Docker Hub served this image with no
    # registry credential set. Not tried: a whole install or upgrade in this
    # form (the references were given to RouterOS by hand), a router at its
    # factory registry-url, other RouterOS versions, an anonymous GHCR pull by
    # RouterOS, and which credential RouterOS presents to a host named only in
    # remote-image=. The site's install/routes page has the detail.
    images:
      - "ghcr.io/jmrplens/mikroscope-agent"
      - "docker.io/jmrplens/mikroscope-agent"
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
      - linux/arm/v5
    dockerfile: Dockerfile.agent
    # Labels describe each architecture's image; GHCR reads a multi-arch
    # package page's description from the INDEX annotations instead, so the
    # two say the same thing on purpose. Reword them together.
    #
    # `documentation` is the site, at the address the README and the generated
    # docs/ hand out (`publicDocs` in site/astro.config.mjs; jmrp.io 301s it to
    # the GitHub Pages copy). It named the docs/ tree before, which is Markdown
    # generated from the English pages for a reader of a checkout, and has no
    # Spanish.
    labels:
      "org.opencontainers.image.title": "mikroscope-agent"
      "org.opencontainers.image.description": "Sub-second kernel telemetry agent for container-capable RouterOS devices"
      "org.opencontainers.image.source": "https://github.com/jmrplens/mikroscope"
      "org.opencontainers.image.url": "https://github.com/jmrplens/mikroscope"
      "org.opencontainers.image.documentation": "https://jmrp.io/docs/mikroscope/"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.vendor": "jmrplens"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .CommitDate }}"
    annotations:
      "index:org.opencontainers.image.title": "mikroscope-agent"
      "index:org.opencontainers.image.description": "Sub-second kernel telemetry agent for container-capable RouterOS devices"
      "index:org.opencontainers.image.source": "https://github.com/jmrplens/mikroscope"
      "index:org.opencontainers.image.url": "https://github.com/jmrplens/mikroscope"
      "index:org.opencontainers.image.documentation": "https://jmrp.io/docs/mikroscope/"
      "index:org.opencontainers.image.licenses": "MIT"
      "index:org.opencontainers.image.vendor": "jmrplens"
      "index:org.opencontainers.image.version": "{{ .Version }}"
      "index:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "index:org.opencontainers.image.created": "{{ .CommitDate }}"

  # The collector, for the compose files under deploy/ and for anyone who would
  # rather not put a Go binary on the host that watches their router.
  #
  # Two platforms, not four. The agent's four are the boards RouterOS runs on;
  # the collector runs on whatever watches them, which in practice is an x86
  # server or an arm64 one. A 32-bit ARM collector would be a NAS or a Pi of
  # that generation, and nobody has asked.
  - id: collector
    ids: [mikroscope]
    images:
      - "ghcr.io/jmrplens/mikroscope"
      - "docker.io/jmrplens/mikroscope"
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.collector
    labels:
      "org.opencontainers.image.title": "mikroscope"
      "org.opencontainers.image.description": "Collector for mikroscope: pulls the agent's ring and forwards it to eleven sinks"
      "org.opencontainers.image.source": "https://github.com/jmrplens/mikroscope"
      "org.opencontainers.image.url": "https://github.com/jmrplens/mikroscope"
      "org.opencontainers.image.documentation": "https://jmrp.io/docs/mikroscope/"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.vendor": "jmrplens"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .CommitDate }}"
    annotations:
      "index:org.opencontainers.image.title": "mikroscope"
      "index:org.opencontainers.image.description": "Collector for mikroscope: pulls the agent's ring and forwards it to eleven sinks"
      "index:org.opencontainers.image.source": "https://github.com/jmrplens/mikroscope"
      "index:org.opencontainers.image.url": "https://github.com/jmrplens/mikroscope"
      "index:org.opencontainers.image.documentation": "https://jmrp.io/docs/mikroscope/"
      "index:org.opencontainers.image.licenses": "MIT"
      "index:org.opencontainers.image.vendor": "jmrplens"
      "index:org.opencontainers.image.version": "{{ .Version }}"
      "index:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "index:org.opencontainers.image.created": "{{ .CommitDate }}"

release:
  github:
    owner: jmrplens
    name: mikroscope
  # Published straight away rather than as a draft: nothing uploads assets
  # after GoReleaser finishes, so there is no window a draft would protect.
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  extra_files:
    # The side-loadable agent images, built by the before hook above;
    # `mikroscope install` builds the same bytes itself.
    - glob: build/agent-images/*.tar
  # With the changelog disabled above, this footer is the whole release body,
  # so the link to the documentation goes first, at the address the README
  # hands out, where a reader of the release page meets it before the tables.
  footer: |
    ---
    **Documentation:** https://jmrp.io/docs/mikroscope/, in English and
    Spanish: [installing it](https://jmrp.io/docs/mikroscope/install/),
    [what it costs the router](https://jmrp.io/docs/mikroscope/cost/), and
    [where it stands](https://jmrp.io/docs/mikroscope/about/status/): what has
    run on hardware and what has not.

    ## Which file do I need?

    Two different programs are published here, and they run on two different
    machines. Read the table before downloading anything.

    | I want to… | Download | Runs on |
    | --- | --- | --- |
    | **Install and use mikroscope** (the usual case) | `mikroscope_{{ .Version }}_<os>_<arch>.tar.gz` — or `.zip` on Windows | **your own computer**, not the router |
    | Let the router fetch the agent | nothing: `mikroscope install --remote-image jmrplens/mikroscope-agent:{{ .Version }}` | the router pulls it itself |
    | Side-load the agent image | one `mikroscope-agent-<arch>.tar` from the table below | uploaded to **the router** |
    | Run the agent outside a container | `mikroscope-agent_{{ .Version }}_linux_<arch>.tar.gz` | wherever you unpack it |

    The **CLI archive** is picked by the operating system and CPU of the
    machine you type commands on: `linux_x86_64` for an ordinary PC or server,
    `darwin_arm64` for an Apple-silicon Mac, `windows_x86_64` for Windows.
    Nothing about it depends on the router.

    The **agent image tar** is picked by the router's architecture, and only
    matters if you install with `--agent-tar`:

    | Your MikroTik | `/system/resource` architecture-name | Agent image tar |
    | --- | --- | --- |
    | RB5009, CCR2004, hAP ax³, most 64-bit ARM boards | `arm64` | `mikroscope-agent-arm64.tar` |
    | hEX Refresh / hEX S (2025), any EN7562CT board | `arm` | `mikroscope-agent-armv5.tar` |
    | Other 32-bit ARM boards (hAP ac², hAP ax², …) | `arm` | `mikroscope-agent-armv7.tar` or the v5 one |
    | CHR, x86 RouterOS | `x86_64` | `mikroscope-agent-amd64.tar` |

    MikroTik's container package exists for **arm, arm64 and x86 only**, and its
    documentation states that "for devices with EN7562CT CPU like the hEX
    Refresh, only arm32v5 container images are supported" — an ARMv5 image runs
    on every 32-bit ARM MikroTik ships, an ARMv7 one does not run on those. If you are not sure which 32-bit board you have,
    take the **v5** tar. `--remote-image` avoids the question entirely: the
    image index carries all four platforms and the router picks its own.

    Run `mikroscope doctor --router user@<address>` first; it reads the
    architecture off the device and says which of these it wants.

    **Agent image:** `jmrplens/mikroscope-agent:{{ .Version }}` on Docker Hub
    and `ghcr.io/jmrplens/mikroscope-agent:{{ .Version }}`
    (linux/amd64, linux/arm64, linux/arm/v7, linux/arm/v5). `--remote-image`
    sends RouterOS the whole reference, registry host included
    (`registry-1.docker.io/jmrplens/mikroscope-agent:{{ .Version }}` for Docker
    Hub), so the device-wide `/container/config registry-url` does not decide
    the pull, needs no setting and is never changed (`doctor`, and `upgrade`
    before it removes anything, read it only to warn about a registry
    username), and no registry login is needed. On the reference RB5009
    (RouterOS 7.24.4, 2026-09-24) the host inside `remote-image=` overrode
    `registry-url`, and Docker Hub served the image with no registry username
    set. Not tried: a whole `install` or `upgrade` in this form (the references
    were given to RouterOS by hand), a router at its factory `registry-url`,
    other RouterOS versions, an anonymous GHCR pull by RouterOS, and which
    credential RouterOS presents to a host named only in `remote-image=`.
    `doctor` warns when `/container/config` holds a username meant for another
    registry than the one the image comes from.

    **Verify the checksums** (keyless, no key to fetch); `checksums.txt` also
    covers the agent image tars:
    ```
    cosign verify-blob \
      --certificate-identity-regexp 'https://github.com/jmrplens/mikroscope/.github/workflows/release.yml@refs/tags/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      --bundle checksums.txt.sigstore.json \
      checksums.txt
    sha256sum --ignore-missing -c checksums.txt
    ```

    **Full changelog:** https://github.com/jmrplens/mikroscope/blob/v{{ .Version }}/CHANGELOG.md
