[cache]
DATABASE = whisper
ENABLE_LOGROTATION = True
USER =
MAX_CACHE_SIZE = inf
MAX_UPDATES_PER_SECOND = 1000
# The default of 50 is fewer paths than one forward of this project creates:
# per-core CPU, per-CPU softnet, per-IRQ counters and the API tier together are
# hundreds of paths in the first seconds.
MAX_CREATES_PER_MINUTE = inf
LINE_RECEIVER_INTERFACE = 0.0.0.0
LINE_RECEIVER_PORT = 2003
PICKLE_RECEIVER_INTERFACE = 0.0.0.0
PICKLE_RECEIVER_PORT = 2004
LOG_LISTENER_CONNECTIONS = False
WHISPER_AUTOFLUSH = False
WHISPER_SPARSE_CREATE = True
ENABLE_TAGS = False

# The image starts carbon-aggregator unconditionally, and it and carbon-cache
# race for 2003; the loser is silently not listening, so the aggregator is
# moved out of the way rather than left to win sometimes.
[aggregator]
LINE_RECEIVER_INTERFACE = 0.0.0.0
LINE_RECEIVER_PORT = 2023
PICKLE_RECEIVER_INTERFACE = 0.0.0.0
PICKLE_RECEIVER_PORT = 2024
DESTINATIONS = 127.0.0.1:2004
