# An HTTP listener that parses line protocol, and a file output that renders it
# again: the round trip is the assertion — what the sink wrote, Telegraf
# parsed, and Telegraf wrote back out.
[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 50000
  metric_buffer_limit = 200000
  omit_hostname = true

[[inputs.http_listener_v2]]
  service_address = ":8186"
  paths = ["/telegraf", "/api/v2/write", "/write"]
  data_format = "influx"
  max_body_size = "64MB"

[[outputs.file]]
  files = ["/out/telegraf.out"]
  data_format = "influx"
  influx_sort_fields = true
