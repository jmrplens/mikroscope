# GitGuardian: what is a credential here and what is not.
#
# test/e2e/docker brings up nine containers with docker compose, on loopback,
# for one test run, and deletes them with the stack. The one credential in that
# directory is the admin password of that Grafana container — the suite needs
# it because Grafana's service-account API is not open to the anonymous role —
# and it is a literal in a test fixture rather than a secret: it authenticates
# nothing that outlives `make test-e2e-docker`, and the compose file reads it
# from MIKROSCOPE_E2E_GRAFANA_PASSWORD so that it need not be the value anyone
# runs with.
version: 2

secret:
  ignored-paths:
    - test/e2e/docker/docker-compose.yml
    - test/e2e/docker/grafana_test.go
